services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tinyurl
      POSTGRES_USER: tiny
      POSTGRES_PASSWORD: tiny
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init-replication.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tiny -d tinyurl"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-replica:
    image: postgres:18-alpine
    user: postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: replpass
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    ports: ["5433:5432"]
    volumes:
      - replicadata:/var/lib/postgresql
      - ./docker/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    restart: on-failure

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]

volumes:
  pgdata:
  replicadata:
