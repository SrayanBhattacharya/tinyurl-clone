services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tinyurl
      POSTGRES_USER: tiny
      POSTGRES_PASSWORD: tiny
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
